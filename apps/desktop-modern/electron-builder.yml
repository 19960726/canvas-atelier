appId: com.canvasatelier.desktop
productName: Canvas Atelier
publish:
  provider: github
  owner: "19960726"
  repo: canvas-atelier
  releaseType: release
directories:
  output: dist-builder/desktop-modern
  buildResources: build
files:
  - dist/**
  - "!node_modules/**"
extraResources:
  - from: ../renderer/dist
    to: renderer/dist
  - from: build/icon.ico
    to: icon.ico
  - from: dist/mcp
    to: mcp
win:
  icon: icon.ico
  signAndEditExecutable: false
artifactName: CanvasAtelier-Win10-11-x64-${version}.exe
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Canvas Atelier
  include: build/installer.nsh
